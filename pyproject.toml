[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-performance-analyzer"
version = "0.1.0"
description = "Predict and compare how videos land, using Meta's TRIBE v2 brain-encoding model, with LLM recommendations that learn from real performance."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "video-performance-analyzer contributors" }]
keywords = ["video", "tribe", "fmri", "neuroscience", "creative", "analysis", "ffmpeg"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "numpy>=1.26",
  "httpx>=0.27",
  "platformdirs>=4.2",
  "tomli-w>=1.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
tribe = ["torch>=2.5,<2.7", "faster-whisper>=1.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/yourname/video-performance-analyzer"
Issues = "https://github.com/yourname/video-performance-analyzer/issues"

[project.scripts]
vpa = "vpa.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["vpa"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PL", "DTZ"]
ignore = [
  # Timestamps are shown to a human in their own timezone; UTC would be wrong here.
  "DTZ005", "DTZ006",
  # subprocess return codes are checked explicitly so we can give better errors
  # than CalledProcessError does.
  "PLW1510",
  # The CLI and TUI dispatch functions take many options by design.
  "PLR0913", "PLR0912", "PLR0915",
  # Magic numbers in thresholds are self-documenting in context.
  "PLR2004",
  # typer.Option/Argument in defaults is the required Typer idiom.
  "B008",
  # Heavy deps (torch, tribev2, faster-whisper) are imported inside functions
  # on purpose, so the CLI stays fast and works without them installed.
  "PLC0415",
  # CLI commands take many options by design.
  "PLR0917",
  # User-entered dates are parsed as naive local time deliberately.
  "DTZ007",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]
