name: publish

# Publishes to PyPI when you create a GitHub Release.
#
# Uses Trusted Publishing (OIDC): PyPI verifies the release came from this
# repository's workflow, so there is no API token to store, leak or rotate.
# One-time setup is described in RELEASING.md.

on:
  release:
    types: [published]
  workflow_dispatch:        # lets you do a TestPyPI dry run by hand

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the version tag matches the package version
        # A release tagged v0.2.0 that ships 0.1.0 is the classic way to publish
        # something nobody can install correctly. Fail loudly instead.
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          echo "tag=$TAG package=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag $TAG != version $PKG"; exit 1; }

      - name: Run the tests before shipping anything
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check vpa tests
          pytest -q

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # add required reviewers here if you want a gate
    permissions:
      id-token: write          # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
